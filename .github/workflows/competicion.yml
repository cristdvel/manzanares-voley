name: Actualizar competición

on:
  schedule:
    - cron: "0 */4 * * *" # cada 4 horas
  workflow_dispatch: {} # ejecución manual

permissions:
  contents: write

concurrency:
  group: competicion
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Descargar calendario y clasificación
        run: node scripts/fetch-competicion.mjs

      - name: Commit si hay cambios
        run: |
          if git diff --quiet -- src/data/competicion.json; then
            echo "Sin cambios en la competición."
            exit 0
          fi
          git config user.name "manzanares-voley-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/competicion.json
          git commit -m "Actualiza calendario y clasificación (FMVoley)"
          git push
