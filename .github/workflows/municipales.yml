name: Actualizar juegos municipales

on:
  schedule:
    - cron: "30 16 * * 3" # miércoles por la tarde: el Ayuntamiento publica los datos ese día
    - cron: "15 6 * * *" # y una vez al día por si se retrasa
  workflow_dispatch: {} # ejecución manual

permissions:
  contents: write

concurrency:
  group: municipales
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Descargar calendario, resultados y clasificación municipales
        run: node scripts/fetch-municipales.mjs

      - name: Commit si hay cambios
        run: |
          if git diff --quiet -- src/data/municipales.json; then
            echo "Sin cambios en los juegos municipales."
            exit 0
          fi
          git config user.name "manzanares-voley-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/municipales.json
          git commit -m "Actualiza juegos municipales (Ayuntamiento de Madrid)"
          git pull --rebase origin main
          git push
